<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Veículo - TutStock Motors</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>

<div class="layout">

  <aside class="sidebar">

    <h3 class="brand-title mb-4">TutStock</h3>

    <ul class="nav flex-column gap-2">

      <li>
        <a href="dashboard.html" class="nav-link">
          Dashboard
        </a>
      </li>

      <li>
        <a href="veiculos.html" class="nav-link">
          Veículos
        </a>
      </li>

      <li>
        <a href="cadastrar-veiculo.html" class="nav-link active-link">
          Cadastrar Veículo
        </a>
      </li>

      <li>
        <a href="relatorios.html" class="nav-link">
          Relatórios
        </a>
      </li>

      <li>
        <a href="perfil.html" class="nav-link">
          Perfil
        </a>
      </li>

      <li>
        <a href="login.html" class="nav-link text-danger">
          Sair
        </a>
      </li>

    </ul>

    <hr class="border-secondary">

    <div class="text-center mt-4">
      <small class="text-secondary">
        TutStock Motors v1.0
      </small>
    </div>

  </aside>

  <main class="main-content">

    <div class="mb-4">
      <h2 class="fw-bold">Cadastrar Veículo</h2>
      <p class="text-muted mb-0">
        Adicione um novo carro ao estoque
      </p>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4">

        <form id="formVeiculo" class="row g-3">

          <div class="col-md-6">
            <label class="form-label">
              Marca
            </label>

            <input
              type="text"
              id="marca"
              class="form-control"
              placeholder="Ex: Toyota"
              required
            >
          </div>

          <div class="col-md-6">
            <label class="form-label">
              Modelo
            </label>

            <input
              type="text"
              id="modelo"
              class="form-control"
              placeholder="Ex: Corolla"
              required
            >
          </div>

          <div class="col-md-4">
            <label class="form-label">
              Ano
            </label>

            <input
              type="number"
              id="ano"
              class="form-control"
              min="1950"
              max="2026"
              placeholder="2020"
              required
            >
          </div>

          <div class="col-md-4">
            <label class="form-label">
              Placa
            </label>

            <input
              type="text"
              id="placa"
              class="form-control"
              maxlength="7"
              placeholder="ABC1D23"
              required
            >
          </div>

          <div class="col-md-4">
            <label class="form-label">
              Quilometragem
            </label>

            <input
              type="number"
              id="quilometragem"
              class="form-control"
              min="0"
              max="1000000"
              placeholder="50000"
              required
            >
          </div>

          <div class="col-md-6">
            <label class="form-label">
              Valor de Compra
            </label>

            <input
              type="number"
              id="valorCompra"
              class="form-control"
              min="1"
              placeholder="35000"
              required
            >
          </div>

          <div class="col-md-6">
            <label class="form-label">
              Valor de Venda
            </label>

            <input
              type="number"
              id="valorVenda"
              class="form-control"
              min="1"
              placeholder="42000"
              required
            >
          </div>

          <div class="col-md-6">
            <label class="form-label">
              Status
            </label>

            <select
              id="status"
              class="form-select"
              required
            >
              <option value="Disponível">
                Disponível
              </option>

              <option value="Reservado">
                Reservado
              </option>

              <option value="Vendido">
                Vendido
              </option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label">
              Descrição
            </label>

            <textarea
              id="descricao"
              class="form-control"
              rows="4"
              placeholder="Informações adicionais do veículo..."
            ></textarea>
          </div>

          <div class="col-12 d-flex gap-2 mt-4">

            <button
              type="submit"
              class="btn btn-primary px-4"
            >
              Salvar Veículo
            </button>

            <a
              href="veiculos.html"
              class="btn btn-outline-secondary px-4"
            >
              Cancelar
            </a>

          </div>

        </form>

      </div>
    </div>

  </main>

</div>

<script src="js/storage.js"></script>
<script src="js/cadastro.js"></script>
<script src="js/auth.js"></script>
<script src="js/loading.js"></script>
</body>
</html>
