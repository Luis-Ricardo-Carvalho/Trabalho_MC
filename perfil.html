<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>

<div class="layout">

  <aside class="sidebar">

    <h3 class="brand-title mb-4">TutStock</h3>

    <ul class="nav flex-column gap-2">

      <li>
        <a href="dashboard.html" class="nav-link">
          Dashboard
        </a>
      </li>

      <li>
        <a href="veiculos.html" class="nav-link">
          Veículos
        </a>
      </li>

      <li>
        <a href="cadastrar-veiculo.html" class="nav-link">
          Cadastrar Veículo
        </a>
      </li>

      <li>
        <a href="relatorios.html" class="nav-link">
          Relatórios
        </a>
      </li>

      <li>
        <a href="perfil.html" class="nav-link active-link">
          Perfil
        </a>
      </li>

      <li>
        <a href="login.html" class="nav-link text-danger">
          Sair
        </a>
      </li>

    </ul>

    <hr class="border-secondary">

    <div class="text-center mt-4">
      <small class="text-secondary">
        TutStock Motors v1.0
      </small>
    </div>

  </aside>

  <main class="main-content">

    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-5 text-center">

        <img
          id="avatar"
          src="https://ui-avatars.com/api/?name=Usuario"
          class="rounded-circle mb-3"
          width="120"
        >

        <h2 id="nomeUsuario" class="fw-bold">
          Usuário
        </h2>

        <p class="text-muted">
          Administrador do Sistema
        </p>

        <form id="formPerfil" class="mt-4">

          <div class="mb-3 text-start">
            <label class="form-label">Nome</label>
            <input
              type="text"
              id="inputNome"
              class="form-control"
            >
          </div>

          <div class="mb-3 text-start">
            <label class="form-label">E-mail</label>
            <input
              type="email"
              id="inputEmail"
              class="form-control"
            >
          </div>

          <button class="btn btn-primary">
            Salvar Alterações
          </button>

        </form>

      </div>
    </div>

  </main>

</div>

<script src="js/perfil.js"></script>
<script src="js/auth.js"></script>
<script src="js/loading.js"></script>
</body>
</html>
