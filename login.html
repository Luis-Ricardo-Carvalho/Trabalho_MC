<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - TutStock Motors</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 p-4 login-card">
          <div class="text-center mb-4">
            <h1 class="fw-bold brand-title">TutStock Motors</h1>
            <p class="text-muted mb-0">Gestão de Estoque Automotivo</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control form-control-lg" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control form-control-lg" id="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg rounded-3">Entrar</button>

            <div class="text-center mt-3">
              <a href="#" class="text-decoration-none small text-muted">Esqueci minha senha</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
