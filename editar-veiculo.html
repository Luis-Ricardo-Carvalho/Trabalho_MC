<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Veículo - TutStock Motors</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <h3 class="brand-title mb-4">
      TutStock
    </h3>

    <ul class="nav flex-column gap-2">

      <li>
        <a href="dashboard.html" class="nav-link">
          Dashboard
        </a>
      </li>

      <li>
        <a href="veiculos.html" class="nav-link active-link">
          Veículos
        </a>
      </li>

      <li>
        <a href="cadastrar-veiculo.html" class="nav-link">
          Cadastrar Veículo
        </a>
      </li>

      <li>
        <a href="relatorios.html" class="nav-link">
          Relatórios
        </a>
      </li>

      <li>
        <a href="perfil.html" class="nav-link">
          Perfil
        </a>
      </li>

      <li>
        <a href="login.html" class="nav-link text-danger">
          Sair
        </a>
      </li>

    </ul>

    <hr class="border-secondary">

    <div class="text-center mt-4">
      <small class="text-secondary">
        TutStock Motors v1.0
      </small>
    </div>

  </aside>

  <!-- CONTEÚDO -->
  <main class="main-content">

    <div class="mb-4">
      <h2 class="fw-bold">
        Editar Veículo
      </h2>

      <p class="text-muted mb-0">
        Atualize as informações do veículo
      </p>
    </div>

    <div class="card border-0 shadow-sm rounded-4">

      <div class="card-body p-4">

        <form id="formEditar" class="row g-3">

          <!-- MARCA -->
          <div class="col-md-6">

            <label class="form-label">
              Marca
            </label>

            <input
              type="text"
              id="marca"
              class="form-control"
              placeholder="Ex: Toyota"
              required
            >

          </div>

          <!-- MODELO -->
          <div class="col-md-6">

            <label class="form-label">
              Modelo
            </label>

            <input
              type="text"
              id="modelo"
              class="form-control"
              placeholder="Ex: Corolla"
              required
            >

          </div>

          <!-- ANO -->
          <div class="col-md-4">

            <label class="form-label">
              Ano
            </label>

            <input
              type="number"
              id="ano"
              class="form-control"
              min="1950"
              max="2026"
              required
            >

          </div>

          <!-- PLACA -->
          <div class="col-md-4">

            <label class="form-label">
              Placa
            </label>

            <input
              type="text"
              id="placa"
              class="form-control"
              maxlength="7"
              placeholder="ABC1D23"
              required
            >

          </div>

          <!-- STATUS -->
          <div class="col-md-4">

            <label class="form-label">
              Status
            </label>

            <select
              id="status"
              class="form-select"
              required
            >

              <option value="Disponível">
                Disponível
              </option>

              <option value="Reservado">
                Reservado
              </option>

              <option value="Vendido">
                Vendido
              </option>

            </select>

          </div>

          <!-- QUILOMETRAGEM -->
          <div class="col-md-6">

            <label class="form-label">
              Quilometragem
            </label>

            <input
              type="number"
              id="quilometragem"
              class="form-control"
              min="0"
              max="1000000"
              required
            >

          </div>

          <!-- VALOR COMPRA -->
          <div class="col-md-6">

            <label class="form-label">
              Valor Compra
            </label>

            <input
              type="number"
              id="valorCompra"
              class="form-control"
              min="1"
              required
            >

          </div>

          <!-- VALOR VENDA -->
          <div class="col-md-6">

            <label class="form-label">
              Valor Venda
            </label>

            <input
              type="number"
              id="valorVenda"
              class="form-control"
              min="1"
              required
            >

          </div>

          <!-- DESCRIÇÃO -->
          <div class="col-12">

            <label class="form-label">
              Descrição
            </label>

            <textarea
              id="descricao"
              rows="4"
              class="form-control"
              placeholder="Informações adicionais do veículo..."
            ></textarea>

          </div>

          <!-- BOTÕES -->
          <div class="col-12 d-flex gap-2 mt-4">

            <button
              type="submit"
              class="btn btn-primary px-4"
            >
              Salvar Alterações
            </button>

            <a
              href="veiculos.html"
              class="btn btn-outline-secondary px-4"
            >
              Cancelar
            </a>

          </div>

        </form>

      </div>

    </div>

  </main>

</div>

<script src="js/storage.js"></script>
<script src="js/editar.js"></script>

</body>
</html>
