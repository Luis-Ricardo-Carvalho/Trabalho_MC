<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veículos - TutStock Motors</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="d-flex">
    <aside class="sidebar">
      <h3 class="brand-title mb-4">TutStock</h3>

      <ul class="nav flex-column gap-2">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="veiculos.html" class="nav-link">Veículos</a></li>
        <li><a href="cadastrar-veiculo.html" class="nav-link">Cadastrar Veículo</a></li>
        <li><a href="relatorios.html" class="nav-link">Relatórios</a></li>
        <li><a href="perfil.html" class="nav-link">Perfil</a></li>
        <li><a href="login.html" class="nav-link text-danger">Sair</a></li>
      </ul>
      
      <hr class="border-secondary">
      <div class="text-center mt-4"><small class="text-secondary">TutStock Motors v1.0</small></div>
    </aside>

    <main class="main-content p-4 w-100">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
          <h2 class="fw-bold">Veículos</h2>
          <p class="text-muted mb-0">Gerencie o estoque da loja</p>
        </div>
        <a href="cadastrar-veiculo.html" class="btn btn-primary rounded-3">+ Novo Veículo</a>
      </div>

      <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" id="busca" class="form-control" placeholder="Buscar por marca ou modelo...">
            </div>
            <div class="col-md-3">
              <select id="filtroStatus" class="form-select">
                <option value="">Todos os status</option>
                <option value="Disponível">Disponível</option>
                <option value="Reservado">Reservado</option>
                <option value="Vendido">Vendido</option>
              </select>
            </div>
            <div class="col-md-3">
              <button class="btn btn-dark w-100" onclick="renderizarVeiculos()">Filtrar</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Marca</th>
                  <th>Modelo</th>
                  <th>Ano</th>
                  <th>Placa</th>
                  <th>Status</th>
                  <th>Preço Venda</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaVeiculos">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/veiculos.js"></script>
</body>
</html>
