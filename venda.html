<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Venda</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container py-5">

  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4">

      <h2 class="fw-bold mb-4">Registrar Venda</h2>

      <form id="formVenda" class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Valor Final</label>
          <input type="number" id="valorFinal" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Data da Venda</label>
          <input type="date" id="dataVenda" class="form-control" required>
        </div>

        <div class="col-12">
          <label class="form-label">Observações</label>
          <textarea id="observacoes" rows="4" class="form-control"></textarea>
        </div>

        <div class="col-12 d-flex gap-2 mt-4">
          <button class="btn btn-success">Confirmar Venda</button>
          <a href="veiculos.html" class="btn btn-outline-secondary">Cancelar</a>
        </div>

      </form>

    </div>
  </div>

</div>

<script src="js/storage.js"></script>
<script src="js/venda.js"></script>

</body>
</html>
