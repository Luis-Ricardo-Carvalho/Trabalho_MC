<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TutStock Motors</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>

  <div class="d-flex">
    <aside class="sidebar">
      <h3 class="brand-title mb-4">TutStock</h3>

      <ul class="nav flex-column gap-2">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="veiculos.html" class="nav-link">Veículos</a></li>
        <li><a href="cadastrar-veiculo.html" class="nav-link">Cadastrar Veículo</a></li>
        <li><a href="relatorios.html" class="nav-link">Relatórios</a></li>
        <li><a href="perfil.html" class="nav-link">Perfil</a></li>
        <li><a href="login.html" class="nav-link text-danger">Sair</a></li>
      </ul>
      
      <hr class="border-secondary">
      <div class="text-center mt-4"><small class="text-secondary">TutStock Motors v1.0</small></div>
    </aside>

    <main class="main-content p-4 w-100">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold">Dashboard</h2>
          <p class="text-muted mb-0">Resumo do estoque da loja</p>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="card dashboard-card shadow-sm border-0">
            <div class="card-body">
              <h6 class="text-muted">Total de Veículos</h6>
              <h2 id="totalVeiculos">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card dashboard-card shadow-sm border-0">
            <div class="card-body">
              <h6 class="text-muted">Disponíveis</h6>
              <h2 id="totalDisponiveis">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card dashboard-card shadow-sm border-0">
            <div class="card-body">
              <h6 class="text-muted">Reservados</h6>
              <h2 id="totalReservados">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card dashboard-card shadow-sm border-0">
            <div class="card-body">
              <h6 class="text-muted">Vendidos</h6>
              <h2 id="totalVendidos">0</h2>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body">
          <h5 class="fw-bold mb-3">Veículos Recentes</h5>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Marca</th>
                  <th>Modelo</th>
                  <th>Ano</th>
                  <th>Status</th>
                  <th>Preço</th>
                </tr>
              </thead>
              <tbody id="tabelaRecentes">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/loading.js"></script>
</body>
</html>
